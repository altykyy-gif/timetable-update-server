name: Windows NSIS release



on:

  workflow_dispatch:
  
  push:
  
    tags:
    
      - 'v*.*.*'
      


permissions:

  contents: write
  


jobs:

  build-windows:
  
    runs-on: windows-latest
    
    defaults:
    
      run:
      
        working-directory: desktop-app
        
    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        


      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: npm
          
          cache-dependency-path: desktop-app/package-lock.json
          


      - name: Install dependencies
      
        run: npm ci
        


      - name: Check JavaScript syntax
      
        shell: bash
        
        run: |
        
          node --check main.js
          
          node --check preload.js
          
          node --check ../server.mjs
          


      - name: Build compressed NSIS installer
      
        run: npx electron-builder --win nsis --x64 --publish never
        


      - name: Upload build artifacts
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: timetable-windows-${{ github.sha }}
          
          path: |
          
            desktop-app/dist/Timetable-*-x64.exe
            
            desktop-app/dist/latest.yml
            
            desktop-app/dist/*.blockmap
            
          if-no-files-found: error
          


      - name: Publish GitHub release assets
      
        if: startsWith(github.ref, 'refs/tags/v')
        
        uses: softprops/action-gh-release@v2
        
        with:
        
          generate_release_notes: true
          
          files: |
          
            desktop-app/dist/Timetable-*-x64.exe
            
            desktop-app/dist/latest.yml
            
            desktop-app/dist/*.blockmap
            















































